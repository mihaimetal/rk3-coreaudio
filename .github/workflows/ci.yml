name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    name: Build & unit test
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Codec unit test (no hardware)
        run: make test

      - name: Build audio driver
        run: make driver

      - name: Build MIDI helper
        run: make midihelper

      - name: Build diagnostic tools
        run: make all enginetest enginetest-ll iotest

      - name: Verify driver bundle signature
        run: codesign -vv build/RigKontrol3.driver
